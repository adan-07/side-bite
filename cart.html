<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Bite 🍔 | Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-container { max-width: 700px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.95rem; }
        .form-control { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 1rem; box-sizing: border-box; }
        .place-order-btn { width: 100%; background: #1d3557; color: #fff; border: none; padding: 14px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .place-order-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .qty-btn { background: #e2e8f0; border: none; padding: 5px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .cart-card { border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 12px; background: #fff; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h1>Side Bite ☕</h1>
            <span class="tagline">Review & Checkout</span>
        </div>
        <a href="menu.html" class="cart-btn" style="text-decoration: none;">← Back to Menu</a>
    </header>

    <main class="container">
        <div class="cart-container">
            <h2 style="margin-bottom: 20px;">Your Cart Items</h2>
            
            <div id="cart-list"></div>

            <hr style="margin: 25px 0; border: none; border-top: 1px solid #e2e8f0;">

            <h3>Order Details</h3>
            <form id="order-form" style="margin-top: 15px;">
                <div class="form-group">
                    <label for="customer-name">Customer Name *</label>
                    <input type="text" id="customer-name" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="payment-method">Payment Method *</label>
                    <select id="payment-method" class="form-control" required>
                        <option value="Cash">💵 Cash on Delivery / Counter</option>
                        <option value="Online">📲 Online / Bank Transfer</option>
                        <option value="Card">💳 Card Payment</option>
                        <option value="Udhar">📕 Udhar (Loan Account)</option>
                    </select>
                </div>

                <div class="form-group" id="phone-field-group" style="display: none;">
                    <label for="customer-phone">Phone Number *</label>
                    <input type="tel" id="customer-phone" class="form-control" placeholder="03xx-xxxxxxx">
                </div>

                <div class="form-group">
                    <label for="table-no">Table Number / Delivery Address *</label>
                    <input type="text" id="table-no" class="form-control" placeholder="e.g. Table 5 or Home Address" required>
                </div>

                <div style="font-size: 1.3rem; font-weight: bold; color: #e63946; margin: 20px 0;">
                    Total Bill: PKR <span id="cart-total">0</span>
                </div>

                <button type="submit" id="submit-order-btn" class="place-order-btn">Confirm & Place Order</button>
            </form>
        </div>
    </main>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { 
            collection, 
            addDoc, 
            doc, 
            getDoc, 
            updateDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let cart = JSON.parse(localStorage.getItem('cart')) || JSON.parse(localStorage.getItem('cafe_cart')) || [];

        // Check if appending items to an existing order
        const urlParams = new URLSearchParams(window.location.search);
        const appendOrderId = urlParams.get('append_to');

        // Pre-fill form fields if updating an existing order
        if (appendOrderId) {
            getDoc(doc(db, "orders", appendOrderId)).then(docSnap => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (document.getElementById('customer-name')) document.getElementById('customer-name').value = data.customerName || '';
                    if (document.getElementById('table-no')) document.getElementById('table-no').value = data.tableNo || '';
                    if (document.getElementById('payment-method')) document.getElementById('payment-method').value = data.paymentMethod || 'Cash';
                    if (document.getElementById('customer-phone') && data.customerPhone) {
                        document.getElementById('customer-phone').value = data.customerPhone;
                        if (data.paymentMethod === 'Udhar' || data.paymentMethod === 'Cash') {
                            document.getElementById('phone-field-group').style.display = 'block';
                        }
                    }
                }
            }).catch(err => console.error("Error loading original order:", err));
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            const totalEl = document.getElementById('cart-total');
            const submitBtn = document.getElementById('submit-order-btn');

            if (!list) return;
            list.innerHTML = '';

            if (cart.length === 0) {
                list.innerHTML = `<p style="color: #64748b; text-align: center; padding: 15px;">Aapka cart khaali hai. Menu se items add karein!</p>`;
                if (totalEl) totalEl.textContent = '0';
                if (submitBtn) submitBtn.disabled = true;
                return;
            }

            if (submitBtn) submitBtn.disabled = false;
            let total = 0;

            cart.forEach((item, index) => {
                const qty = item.qty || item.quantity || 1;
                const price = Number(item.price || 0);
                const itemTotal = price * qty;
                total += itemTotal;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-card';
                itemDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div>
                            <h4 style="margin: 0; color: #1e293b; font-size: 1.05rem;">${item.name || item.title}</h4>
                            <span style="color: #64748b; font-size: 0.85rem;">PKR ${price} x ${qty}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button type="button" class="qty-btn" data-action="minus" data-index="${index}">-</button>
                            <span style="font-weight: bold; font-size: 0.95rem;">${qty}</span>
                            <button type="button" class="qty-btn" data-action="plus" data-index="${index}">+</button>
                            <span style="font-weight: bold; color: #e63946; margin-left: 8px;">PKR ${itemTotal}</span>
                        </div>
                    </div>
                    <div>
                        <input 
                            type="text" 
                            class="form-control cart-note-input" 
                            data-index="${index}"
                            placeholder="Customization (e.g. Extra Mayo, No Olives, Mild Spicy)" 
                            value="${item.notes || ''}"
                            style="padding: 8px 12px; font-size: 0.88rem;"
                        >
                    </div>
                `;
                list.appendChild(itemDiv);
            });

            if (totalEl) totalEl.textContent = total;
        }

        function updateCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            localStorage.setItem('cafe_cart', JSON.stringify(cart));
            renderCart();
        }

        // Qty adjust button listener
        document.getElementById('cart-list').addEventListener('click', (e) => {
            if (!e.target.classList.contains('qty-btn')) return;
            const index = e.target.getAttribute('data-index');
            const action = e.target.getAttribute('data-action');

            let currentQty = cart[index].qty || cart[index].quantity || 1;
            if (action === 'plus') {
                currentQty++;
            } else if (action === 'minus') {
                currentQty--;
            }

            if (currentQty <= 0) {
                cart.splice(index, 1);
            } else {
                cart[index].qty = currentQty;
                cart[index].quantity = currentQty;
            }
            updateCart();
        });

        // Save Customization Notes in state
        document.getElementById('cart-list').addEventListener('input', (e) => {
            if (e.target.classList.contains('cart-note-input')) {
                const index = e.target.getAttribute('data-index');
                if (cart[index]) {
                    cart[index].notes = e.target.value;
                    localStorage.setItem('cart', JSON.stringify(cart));
                    localStorage.setItem('cafe_cart', JSON.stringify(cart));
                }
            }
        });

        // Payment toggle listener
        const paySelect = document.getElementById('payment-method');
        const phoneGroup = document.getElementById('phone-field-group');
        paySelect.addEventListener('change', () => {
            if (paySelect.value === 'Udhar' || paySelect.value === 'Cash') {
                phoneGroup.style.display = 'block';
            } else {
                phoneGroup.style.display = 'none';
            }
        });

        // Order Submit logic (Appends to existing order if append_to present)
        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (cart.length === 0) return;

            const name = document.getElementById('customer-name').value;
            const table = document.getElementById('table-no').value;
            const method = paySelect.value;
            const phone = document.getElementById('customer-phone').value || 'N/A';
            const submitBtn = document.getElementById('submit-order-btn');

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = appendOrderId ? 'Updating Order...' : 'Placing Order...';
            }

            const formattedItems = cart.map(i => ({
                name: i.name || i.title,
                price: Number(i.price || 0),
                qty: Number(i.qty || i.quantity || 1),
                notes: i.notes || ''
            }));

            const subtotal = formattedItems.reduce((sum, i) => sum + (i.price * i.qty), 0);

            try {
                let targetDocId;

                if (appendOrderId) {
                    const orderRef = doc(db, "orders", appendOrderId);
                    const orderSnap = await getDoc(orderRef);

                    if (orderSnap.exists()) {
                        const existingData = orderSnap.data();
                        const mergedItems = [...(existingData.items || []), ...formattedItems];
                        const newTotal = Number(existingData.total || 0) + subtotal;

                        await updateDoc(orderRef, {
                            items: mergedItems,
                            total: newTotal,
                            updatedAt: serverTimestamp()
                        });

                        targetDocId = appendOrderId;
                    } else {
                        const docRef = await addDoc(collection(db, "orders"), {
                            customerName: name,
                            tableNo: table,
                            paymentMethod: method,
                            customerPhone: phone,
                            items: formattedItems,
                            total: subtotal,
                            status: 'Pending',
                            createdAt: serverTimestamp()
                        });
                        targetDocId = docRef.id;
                    }
                } else {
                    const docRef = await addDoc(collection(db, "orders"), {
                        customerName: name,
                        tableNo: table,
                        paymentMethod: method,
                        customerPhone: phone,
                        items: formattedItems,
                        total: subtotal,
                        status: 'Pending',
                        createdAt: serverTimestamp()
                    });
                    targetDocId = docRef.id;
                }

                localStorage.removeItem('cart');
                localStorage.removeItem('cafe_cart');
                window.location.href = `order-status.html?id=${targetDocId}`;
            } catch (err) {
                alert("Order error: " + err.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Confirm & Place Order';
                }
            }
        });

        renderCart();
    </script>
</body>
</html>
